name: comp-script-shared-lib-pipeline
on:
  workflow_dispatch:
env:
  APP_NAME: lean-app
  DEPLOY_ENV: "${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}"
jobs:
  Setup:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: clean workspace
      shell: bash
      run: rm -rf ${{ github.workspace }}/*
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Notify - Setup Complete
      uses: Samarth-org/devops-repo/.github/workflows/reusable.yml@main
      with:
        status: Setup Complete
  Complex_Script_Execution:
    name: Complex Script Execution
    runs-on: ubuntu-latest
    needs: Setup
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Run script
      shell: bash
      run: |-
        chmod +x scripts/deploy-logic.sh
        ./scripts/deploy-logic.sh ${{ env.DEPLOY_ENV }}
